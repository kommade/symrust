[package]
name = "rust-calculus"
version = "0.1.1"
edition = "2024"

[dependencies]
arpfloat = "=0.1.10"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[features]
default = []
# Enables the crate's `Complex` number type (and the root-of-unity integration
# that uses it). Off by default: with it disabled none of the extra code is
# compiled, so there is zero runtime cost.
complex = []
# Enables the general algebraic-number machinery (Option B): exact real roots of
# arbitrary rational polynomials via Sturm-sequence isolation, so the integrator
# can factor irreducible factors of any degree. Off by default: with it disabled
# none of the extra code is compiled, so there is zero runtime cost. Implies
# `complex`, because the roots-of-unity path integrates over `Complex` residues.
algebraic = ["complex"]
[dev-dependencies]
color-eyre = "0.6.3"

