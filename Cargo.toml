[package]
name = "symrust"
version = "0.1.2"
edition = "2024"

[lib]
name = "symrust"
path = "src/lib.rs"

[dependencies]
arpfloat = "=0.1.10"
# The `symr` REPL's line editor (src/bin/repl). Optional and consumed only
# through the `repl` feature below, so a plain build of the library — or a
# build that merely depends on it — never compiles any of this.
rustyline = { version = "19.0.0", optional = true }

[features]
default = []
# Enables the crate's `Complex` number type. Combined
# with `algebraic` it additionally enables the exact roots-of-unity integration
# of cyclotomic denominators (which factors over C using `Complex` residues).
complex = []
# Enables the general algebraic-number machinery: exact real roots of
# arbitrary rational polynomials via Sturm-sequence isolation, so the integrator
# can factor irreducible factors of any degree. This is independent of `complex`:
# on its own it factors over R (real surds), not over C. Enable `complex` as well
# to factor over C and write cyclotomic integrals in terms of roots of unity.
# Implies `generic_const`: the `Multiquadratic` field it is built on stores its
# `2^N` coefficients in a `[Rat; 1 << N]`, which needs `generic_const_exprs`.
algebraic = ["generic_const"]
# Enables the use of generic const expressions, which allows for more
# compile-time optimizations and more expressive type-level programming. This
# is an unstable feature and may not be available on all Rust versions. It is
# off by default to maintain compatibility with stable Rust.
generic_const = []
# Dependency feature for the `symr` REPL binary (src/bin/repl). Declared with
# `dep:` so enabling it never exposes `rustyline` through the library itself:
# the only consumer of the dependency is the binary via `required-features`.
# The binary also turns on every library feature — it is the crate's own
# front end, so it carries the whole surface (exact algebraic roots, the
# complex field) without imposing any of it on dependents, who never build
# the bin target.
repl = ["dep:rustyline", "algebraic", "complex"]

[[bin]]
name = "symr"
path = "src/bin/repl/main.rs"
# The line editor exists only behind `repl`, so without that feature the
# binary is not built at all: `required-features` drops it from cargo's
# target set, and a crate depending on this package builds only the [lib]
# target anyway, so the REPL never compiles for library users. Run it with
# `cargo run --features repl --bin symr`.
required-features = ["repl"]

